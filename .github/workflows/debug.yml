name: Debug portal
on:
  workflow_dispatch:
    inputs:
      url:
        description: modo
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt curl_cffi playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y -q xvfb >/dev/null
      - name: Testes
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" python collector/_probe.py
