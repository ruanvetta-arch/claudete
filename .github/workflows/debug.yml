name: Debug portal
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL para testar (ou "fontes" para testar várias)
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt curl_cffi
      - name: Testes de acesso
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, re, sys, json
          from curl_cffi import requests as cr
          url=os.environ['URL']
          def resumo(tag, r):
              t=r.text or ''
              title=re.search(r'<title>([^<]*)',t)
              print(f"== {tag}: status={r.status_code} len={len(t)} cf={'Just a moment' in t} title={title.group(1)[:70] if title else None} head={t[:160]!r}")
          tests = []
          if url == 'fontes':
              tests = [
                ('vivareal-glue', 'https://glue-api.vivareal.com/v2/listings?addressCity=Bras%C3%ADlia&addressState=Distrito%20Federal&addressLocationId=BR%3EDistrito%20Federal%3ENULL%3EBrasilia&business=RENTAL&categoryPage=RESULT&listingType=USED&unitTypes=HOME&unitTypesV3=HOME&usageTypes=RESIDENTIAL&bedrooms=2&size=36&from=0&includeFields=search(result(listings(listing(id,title,address,bedrooms,bathrooms,parkingSpaces,usableAreas,totalAreas,pricingInfos,amenities,images,updatedAt,createdAt),link(href)),totalCount))', {'x-domain':'www.vivareal.com.br','referer':'https://www.vivareal.com.br/','origin':'https://www.vivareal.com.br'}),
                ('zap-glue', 'https://glue-api.zapimoveis.com.br/v2/listings?addressCity=Bras%C3%ADlia&addressState=Distrito%20Federal&addressLocationId=BR%3EDistrito%20Federal%3ENULL%3EBrasilia&business=RENTAL&categoryPage=RESULT&listingType=USED&unitTypes=HOME&usageTypes=RESIDENTIAL&bedrooms=2&size=36&from=0&includeFields=search(result(listings(listing(id,title,address,bedrooms,pricingInfos,images),link(href)),totalCount))', {'x-domain':'www.zapimoveis.com.br','referer':'https://www.zapimoveis.com.br/','origin':'https://www.zapimoveis.com.br'}),
                ('nestoria-api', 'https://api.nestoria.com.br/api?encoding=json&pretty=0&action=search_listings&country=br&listing_type=rent&property_type=house&bedroom_min=2&place_name=Distrito%20Federal&number_of_results=50&page=1&sort=newest', {}),
                ('nestoria-html', 'https://www.nestoria.com.br/distrito-federal/casas/aluguel?bedrooms=2', {}),
                ('olx', 'https://www.olx.com.br/imoveis/aluguel/casas/estado-df?ros=2', {}),
                ('imovelweb', 'https://www.imovelweb.com.br/casas-aluguel-distrito-federal-mais-de-2-quartos.html', {}),
                ('trovit', 'https://imoveis.trovit.com.br/aluguel-casa-distrito-federal', {}),
                ('mitula', 'https://imoveis.mitula.com.br/imoveis/aluguel-casas-2-quartos-brasilia', {}),
                ('loft', 'https://loft.com.br/alugar/casas/df/brasilia', {}),
                ('chavesnamao', 'https://www.chavesnamao.com.br/casas-para-alugar/df/', {}),
              ]
          else:
              tests=[('url', url, {})]
          for tag,u,h in tests:
              try:
                  r=cr.get(u, impersonate='chrome', timeout=40, headers={'Accept-Language':'pt-BR,pt;q=0.9', **h})
                  resumo(tag, r)
                  if 'glue' in tag and r.status_code==200:
                      j=r.json(); res=j.get('search',{}).get('result',{}); print('   total', res.get('totalCount'), 'n', len(res.get('listings',[])))
                      if res.get('listings'): print('   sample', json.dumps(res['listings'][0])[:800])
                  if 'nestoria-api' in tag and r.status_code==200:
                      j=r.json(); print('   nestoria', json.dumps(j)[:600])
              except Exception as e: print(tag,'ERR',e)
          PY
