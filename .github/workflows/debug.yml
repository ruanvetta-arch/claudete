name: Debug portal
on:
  workflow_dispatch:
    inputs:
      url:
        description: modo
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt curl_cffi
      - name: Testes
        run: python collector/_probe.py
