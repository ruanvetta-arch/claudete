name: Coletar casas

on:
  schedule:
    # 07:00 e 13:00 em Brasília (UTC-3) = 10:00 e 16:00 UTC
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Rodar coletor
        run: python collector/run.py
      - name: Publicar dados
        run: |
          git config user.name "claudete-bot"
          git config user.email "claudete-bot@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: coleta $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase origin main || true
            git push
          fi
